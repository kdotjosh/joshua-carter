<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOSHUA CARTER® / ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px/1.4 "Courier New",monospace}header{background:#29387f;border-bottom:3px solid #eee;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;letter-spacing:2px;margin:0}main{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:#ddd;color:#111;border:3px solid #eee;box-shadow:6px 6px 0 #000;margin-bottom:22px;padding:18px}.panel h2{margin:0 0 14px;font-size:15px;letter-spacing:1px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:11px;font-weight:bold}input,textarea,select{font:13px "Courier New",monospace;border:2px solid #555;padding:9px;background:#fff;color:#111}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{font:12px "Courier New",monospace;border:2px solid #222;background:#fff;color:#111;padding:10px 14px;cursor:pointer;font-weight:bold}button:hover{background:#29387f;color:#fff}button.danger{background:#b00020;color:#fff}.status{margin-top:10px;min-height:20px;font-size:12px}.product{background:#f2f2f2;border:2px solid #777;padding:14px;margin:12px 0}.productTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.productName{font-weight:bold}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.thumb{width:75px;height:90px;border:2px solid #111;background:#aaa;object-fit:cover}.muted{color:#555;font-size:11px}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.hidden{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body>
<header><h1>JOSHUA CARTER® / ADMIN</h1><a href="./" style="color:#fff;text-decoration:none">VIEW SHOP ↗</a></header>
<main>
<section class="panel"><h2>GITHUB CONNECTION</h2><div class="row">
<div class="field"><label>GITHUB OWNER / USERNAME</label><input id="owner" placeholder="your-github-username"></div>
<div class="field"><label>REPOSITORY</label><input id="repo" placeholder="repository-name"></div>
<div class="field"><label>BRANCH</label><input id="branch" value="main"></div>
<div class="field"><label>ACCESS TOKEN</label><input id="token" type="password" placeholder="github_pat_..."></div>
</div><div class="muted" style="margin-top:10px">Use a GitHub fine-grained token with Contents: Read and write for this repository. The token is kept only in this browser session and is not written into the site files.</div><div class="actions"><button id="loadBtn">LOAD FROM GITHUB</button></div><div class="status" id="connStatus"></div></section>

<section class="panel"><h2>TOP ANNOUNCEMENT</h2><div class="field"><label>TEXT SHOWN IN THE BLUE BAR</label><input id="announcement"></div><div class="actions"><button id="saveNotice">SAVE ANNOUNCEMENT</button></div><div class="status" id="noticeStatus"></div></section>

<section class="panel"><h2>PRODUCTS</h2><div class="actions"><button id="newProduct">+ ADD NEW DESIGN</button><button id="saveAll">SAVE ALL PRODUCT CHANGES</button></div><div id="products"></div><div class="status" id="productStatus"></div></section>
</main>
<script>
(()=>{
let data={version:1,products:[]}, config={announcement:''};
const $=id=>document.getElementById(id), stateKey='jc_admin_settings';
try{const s=JSON.parse(sessionStorage.getItem(stateKey)||'{}');if(s.owner)$('owner').value=s.owner;if(s.repo)$('repo').value=s.repo;if(s.branch)$('branch').value=s.branch}catch(e){}
function saveConn(){try{sessionStorage.setItem(stateKey,JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main'}))}catch(e){}}
function headers(){return {Authorization:'Bearer '+$('token').value.trim(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
function base(){return 'https://api.github.com/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())+'/contents/'}
async function getFile(path){const r=await fetch(base()+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'),{headers:headers()});if(!r.ok)throw new Error(await r.text());return r.json()}
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
async function putFile(path,content,message,sha){const body={message,content:b64utf8(content),branch:$('branch').value.trim()||'main'};if(sha)body.sha=sha;const r=await fetch(base()+path,{method:'PUT',headers:headers(),body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slug(s){return String(s||'product').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'product'}
function render(){const wrap=$('products');wrap.innerHTML='';data.products.forEach((p,i)=>{const el=document.createElement('div');el.className='product';el.innerHTML=`<div class="productTop"><div class="productName">${esc(p.name||'NEW DESIGN')}</div><button class="danger" data-del="${i}">DELETE</button></div><div class="row" style="margin-top:12px"><div class="field"><label>PRODUCT NAME</label><input data-i="${i}" data-k="name" value="${esc(p.name)}"></div><div class="field"><label>PRICE (KRW)</label><input data-i="${i}" data-k="price" type="number" min="0" value="${Number(p.price||0)}"></div><div class="field"><label>STOCK / REMAINING QTY</label><input data-i="${i}" data-k="stock" type="number" min="0" value="${Number(p.stock||0)}"></div><div class="field"><label>STATUS</label><label class="check"><input data-i="${i}" data-k="soldOut" type="checkbox" ${p.soldOut?'checked':''}> FORCE SOLD OUT</label><div class="muted">If unchecked and stock is above 0, the shop shows “X LEFT” and enables the cart button. Stock 0 automatically shows SOLD OUT.</div></div><div class="field full"><label>PRODUCT STORY / MORE INFO</label><textarea data-i="${i}" data-k="description">${esc(p.description||'')}</textarea></div><div class="field full"><label>PHOTOS</label><input data-i="${i}" data-photo="1" type="file" accept="image/*" multiple><div class="muted">Choose one or more images. They will be uploaded to the repository when you save.</div><div class="thumbs">${(p.images||[]).map((src,j)=>`<div><img class="thumb" src="${esc(src)}"><button type="button" data-photo-del="${i}" data-photo-index="${j}">REMOVE</button></div>`).join('')}</div></div></div>`;wrap.appendChild(el)});
wrap.querySelectorAll('[data-i][data-k]').forEach(x=>x.addEventListener('input',()=>{const p=data.products[Number(x.dataset.i)],k=x.dataset.k;p[k]=k==='price'||k==='stock'?Number(x.value||0):k==='soldOut'?x.checked:x.value;renderHeaderOnly()}));
wrap.querySelectorAll('[data-i][data-k="soldOut"]').forEach(x=>x.addEventListener('change',()=>{data.products[Number(x.dataset.i)].soldOut=x.checked}));
wrap.querySelectorAll('[data-photo-del]').forEach(x=>x.addEventListener('click',()=>{const p=data.products[Number(x.dataset.photoDel)],idx=Number(x.dataset.photoIndex);p.images.splice(idx,1);render()}));
wrap.querySelectorAll('[data-del]').forEach(x=>x.addEventListener('click',()=>{if(confirm('Delete this product?')){data.products.splice(Number(x.dataset.del),1);render()}}));
wrap.querySelectorAll('[data-photo]').forEach(x=>x.addEventListener('change',()=>{x.dataset.filesReady='1'}));
}
function renderHeaderOnly(){document.querySelectorAll('.product').forEach((el,i)=>{const n=el.querySelector('.productName');if(n)n.textContent=data.products[i]?.name||'NEW DESIGN'})}
function collectFiles(){return [...document.querySelectorAll('[data-photo]')].map(x=>({index:Number(x.dataset.i),files:[...x.files]})).filter(x=>x.files.length)}
async function uploadImage(path,file){const buf=await file.arrayBuffer();let bin='';const bytes=new Uint8Array(buf);const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode(...bytes.subarray(i,i+chunk));const content=btoa(bin);const body={message:'Add product image',content,branch:$('branch').value.trim()||'main'};const r=await fetch(base()+path,{method:'PUT',headers:headers(),body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
async function saveProducts(){saveConn();$('productStatus').textContent='SAVING...';try{const uploads=collectFiles();for(const item of uploads){const p=data.products[item.index];p.images=p.images||[];for(const file of item.files){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path='assets/products/'+slug(p.id||p.name)+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;await uploadImage(path,file);p.images.push(path)}}data.products.forEach((p,i)=>{p.id=p.id||slug(p.name)+'-'+Date.now()+i;p.price=Number(p.price||0);p.stock=Math.max(0,Number(p.stock||0));p.soldOut=!!p.soldOut;p.images=p.images||[]});const existing=await getFile('products.json').catch(()=>null);await putFile('products.json',JSON.stringify({version:1,products:data.products},null,2),'Update products',existing?.sha);render();$('productStatus').textContent='SAVED. Refresh the shop to see the changes.'}catch(e){$('productStatus').textContent='ERROR: '+e.message}}
async function saveNotice(){saveConn();$('noticeStatus').textContent='SAVING...';try{const existing=await getFile('site-config.json').catch(()=>null);config.announcement=$('announcement').value;await putFile('site-config.json',JSON.stringify({announcement:config.announcement},null,2),'Update announcement',existing?.sha);$('noticeStatus').textContent='SAVED.'}catch(e){$('noticeStatus').textContent='ERROR: '+e.message}}
async function load(){saveConn();$('connStatus').textContent='LOADING...';try{const [p,c]=await Promise.all([getFile('products.json'),getFile('site-config.json')]);data=JSON.parse(decodeURIComponent(escape(atob(p.content.replace(/\n/g,'')))));config=JSON.parse(decodeURIComponent(escape(atob(c.content.replace(/\n/g,'')))));$('announcement').value=config.announcement||'';render();$('connStatus').textContent='CONNECTED.'}catch(e){$('connStatus').textContent='ERROR: '+e.message}}
$('loadBtn').addEventListener('click',load);$('saveAll').addEventListener('click',saveProducts);$('saveNotice').addEventListener('click',saveNotice);$('newProduct').addEventListener('click',()=>{data.products.push({id:'',name:'NEW JOSHUA CARTER DESIGN',price:0,stock:0,soldOut:true,description:'',images:[]});render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})});
fetch('products.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>render());fetch('site-config.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{$('announcement').value=x.announcement||''}).catch(()=>{});
})();
</script></body></html>
