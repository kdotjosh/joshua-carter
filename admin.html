<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOSHUA CARTER® / ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px/1.4 "Courier New",monospace}header{background:#29387f;border-bottom:3px solid #eee;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;letter-spacing:2px;margin:0}main{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:#ddd;color:#111;border:3px solid #eee;box-shadow:6px 6px 0 #000;margin-bottom:22px;padding:18px}.panel h2{margin:0 0 14px;font-size:15px;letter-spacing:1px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:11px;font-weight:bold}input,textarea,select{font:13px "Courier New",monospace;border:2px solid #555;padding:9px;background:#fff;color:#111}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{font:12px "Courier New",monospace;border:2px solid #222;background:#fff;color:#111;padding:10px 14px;cursor:pointer;font-weight:bold}button:hover{background:#29387f;color:#fff}button.danger{background:#b00020;color:#fff}.status{margin-top:10px;min-height:20px;font-size:12px}.product{background:#f2f2f2;border:2px solid #777;padding:14px;margin:12px 0}.productTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.productName{font-weight:bold}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.thumb{width:75px;height:90px;border:2px solid #111;background:#aaa;object-fit:cover}.muted{color:#555;font-size:11px}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.hidden{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body>
<header><h1>JOSHUA CARTER® / ADMIN</h1><a href="./" style="color:#fff;text-decoration:none">VIEW SHOP ↗</a></header>
<main>
<section class="panel"><h2>GITHUB CONNECTION</h2><div class="row">
<div class="field"><label>GITHUB OWNER / USERNAME</label><input id="owner" placeholder="your-github-username"></div>
<div class="field"><label>REPOSITORY</label><input id="repo" placeholder="repository-name"></div>
<div class="field"><label>BRANCH</label><input id="branch" value="main"></div>
<div class="field"><label>ACCESS TOKEN</label><input id="token" type="password" placeholder="github_pat_..."></div>
</div><div class="muted" style="margin-top:10px">Use a GitHub fine-grained token with Contents: Read and write for this repository. The token is kept only in this browser session and is not written into the site files.</div><div class="actions"><button id="loadBtn">LOAD FROM GITHUB</button></div><div class="status" id="connStatus"></div></section>

<section class="panel"><h2>TOP ANNOUNCEMENT</h2><div class="row"><div class="field"><label>TEXT (ENGLISH)</label><input id="announcementEn"></div><div class="field"><label>TEXT (한국어)</label><input id="announcementKo"></div></div><div class="actions"><button id="saveNotice">SAVE ANNOUNCEMENT</button></div><div class="status" id="noticeStatus"></div></section>

<section class="panel"><h2>GALLERY</h2><div class="actions"><button id="newFolder">+ ADD NEW FOLDER</button><button id="saveGallery">SAVE ALL GALLERY CHANGES</button></div><div id="galleryFoldersAdmin"></div><div class="status" id="galleryStatus"></div></section>

<section class="panel"><h2>PRODUCTS</h2><div class="actions"><button id="newProduct">+ ADD NEW DESIGN</button><button id="saveAll">SAVE ALL PRODUCT CHANGES</button></div><div id="products"></div><div class="status" id="productStatus"></div></section>
</main>
<script>
(()=>{
let data={version:1,products:[]}, config={announcement:''}, gallery={version:1,folders:[]};
const $=id=>document.getElementById(id), stateKey='jc_admin_settings';
try{const s=JSON.parse(sessionStorage.getItem(stateKey)||'{}');if(s.owner)$('owner').value=s.owner;if(s.repo)$('repo').value=s.repo;if(s.branch)$('branch').value=s.branch}catch(e){}
function saveConn(){try{sessionStorage.setItem(stateKey,JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main'}))}catch(e){}}
function headers(){return {Authorization:'Bearer '+$('token').value.trim(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
function base(){return 'https://api.github.com/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())+'/contents/'}
function checkConnection(){if(!$('owner').value.trim()||!$('repo').value.trim()||!$('token').value.trim())throw new Error('OWNER, REPOSITORY, AND ACCESS TOKEN ARE REQUIRED')}
async function api(path,opts={},attempt=0){checkConnection();const r=await fetch(base()+path,opts);if(r.status===401)throw new Error('GitHub rejected the access token (401). Re-enter the token in the admin page and try again.');if(r.status===409&&attempt<1){await new Promise(x=>setTimeout(x,700));return api(path,opts,attempt+1)}if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error(t||('GitHub API error '+r.status))}return r.json()}
async function getFile(path){return api(path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'),{headers:headers()})}
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
async function putFile(path,content,message,sha){const body={message,content:b64utf8(content),branch:$('branch').value.trim()||'main'};if(sha)body.sha=sha;return api(path,{method:'PUT',headers:headers(),body:JSON.stringify(body)})}
async function putFileFresh(path,content,message){let existing=null;try{existing=await getFile(path)}catch(e){if(!String(e.message).includes('404'))throw e}try{return await putFile(path,content,message,existing?.sha)}catch(e){if(String(e.message).includes('409')){existing=await getFile(path);return await putFile(path,content,message,existing.sha)}throw e}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slug(s){return String(s||'product').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'product'}
function langOf(v){if(v&&typeof v==='object')return {en:v.en||'',ko:v.ko||''};return {en:v||'',ko:''}}
function nameText(v){const l=langOf(v);return l.en||l.ko||''}
function renderGallery(){const wrap=$('galleryFoldersAdmin');wrap.innerHTML='';(gallery.folders||[]).forEach((f,i)=>{const n=langOf(f.name);const el=document.createElement('div');el.className='product';el.innerHTML=`<div class="productTop"><div class="productName">${esc(n.en||n.ko||'NEW FOLDER')}</div><button class="danger" data-gdel="${i}">DELETE FOLDER</button></div><div class="row" style="margin-top:12px"><div class="field"><label>FOLDER NAME (ENGLISH)</label><input data-gi="${i}" data-gk="name_en" value="${esc(n.en)}"></div><div class="field"><label>FOLDER NAME (한국어)</label><input data-gi="${i}" data-gk="name_ko" value="${esc(n.ko)}"></div><div class="field full"><label>IMAGES</label><input data-gi="${i}" data-gphoto="1" type="file" accept="image/*" multiple><div class="muted">Choose one or more images. They will be uploaded when you save the gallery.</div><div class="thumbs">${(f.images||[]).map((src,j)=>`<div><img class="thumb" src="${esc(src)}"><button type="button" data-gphoto-del="${i}" data-gphoto-index="${j}">REMOVE</button></div>`).join('')}</div></div></div>`;wrap.appendChild(el)});
wrap.querySelectorAll('[data-gi][data-gk]').forEach(x=>x.addEventListener('input',()=>{const f=gallery.folders[Number(x.dataset.gi)],k=x.dataset.gk;f.name=langOf(f.name);if(k==='name_en')f.name.en=x.value;else f.name.ko=x.value;renderGalleryHeaderOnly()}));
wrap.querySelectorAll('[data-gdel]').forEach(x=>x.addEventListener('click',()=>{if(confirm('Delete this folder from the gallery?')){gallery.folders.splice(Number(x.dataset.gdel),1);renderGallery()}}));
wrap.querySelectorAll('[data-gphoto-del]').forEach(x=>x.addEventListener('click',()=>{const f=gallery.folders[Number(x.dataset.gphotoDel)],idx=Number(x.dataset.gphotoIndex);f.images.splice(idx,1);renderGallery()}));
}
function renderGalleryHeaderOnly(){document.querySelectorAll('#galleryFoldersAdmin .product').forEach((el,i)=>{const n=el.querySelector('.productName');if(n)n.textContent=nameText(gallery.folders[i]?.name)||'NEW FOLDER'})}
function collectGalleryFiles(){return [...document.querySelectorAll('[data-gphoto]')].map(x=>({index:Number(x.dataset.gi),files:[...x.files]})).filter(x=>x.files.length)}
async function saveGallery(){saveConn();$('galleryStatus').textContent='SAVING...';try{checkConnection();const uploads=collectGalleryFiles();for(const item of uploads){const f=gallery.folders[item.index];f.images=f.images||[];for(const file of item.files){$('galleryStatus').textContent='UPLOADING GALLERY IMAGE...';const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path='assets/gallery/'+slug(nameText(f.name)||'folder')+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;await uploadImage(path,file);f.images.push(path)}}gallery.folders.forEach((f,i)=>{f.id=f.id||slug(nameText(f.name)||'folder')+'-'+Date.now()+i;f.name=langOf(f.name);f.images=f.images||[]});await putFileFresh('gallery.json',JSON.stringify({version:1,folders:gallery.folders},null,2),'Update gallery');renderGallery();$('galleryStatus').textContent='SAVED.'}catch(e){$('galleryStatus').textContent='ERROR: '+e.message}}
async function loadGallery(){try{const g=await getFile('gallery.json');gallery=JSON.parse(decodeURIComponent(escape(atob(g.content.replace(/\n/g,'')))));if(!gallery||!Array.isArray(gallery.folders))gallery={version:1,folders:[]};renderGallery()}catch(e){if(String(e.message).includes('404')){gallery={version:1,folders:[]};renderGallery()}else throw e}}

function render(){const wrap=$('products');wrap.innerHTML='';data.products.forEach((p,i)=>{const nm=langOf(p.name),desc=langOf(p.description);const el=document.createElement('div');el.className='product';el.innerHTML=`<div class="productTop"><div class="productName">${esc(nm.en||nm.ko||'NEW DESIGN')}</div><button class="danger" data-del="${i}">DELETE</button></div><div class="row" style="margin-top:12px"><div class="field"><label>PRODUCT NAME (ENGLISH)</label><input data-i="${i}" data-k="name_en" value="${esc(nm.en)}"></div><div class="field"><label>PRODUCT NAME (한국어)</label><input data-i="${i}" data-k="name_ko" value="${esc(nm.ko)}"></div><div class="field"><label>PRICE (KRW)</label><input data-i="${i}" data-k="price" type="number" min="0" value="${Number(p.price||0)}"></div><div class="field"><label>STOCK / REMAINING QTY</label><input data-i="${i}" data-k="stock" type="number" min="0" value="${Number(p.stock||0)}"></div><div class="field"><label>STATUS</label><label class="check"><input data-i="${i}" data-k="soldOut" type="checkbox" ${p.soldOut?'checked':''}> FORCE SOLD OUT</label><div class="muted">If unchecked and stock is above 0, the shop shows “X LEFT” and enables the cart button. Stock 0 automatically shows SOLD OUT.</div></div><div class="field full"><label>PRODUCT STORY / MORE INFO (ENGLISH)</label><textarea data-i="${i}" data-k="description_en">${esc(desc.en)}</textarea></div><div class="field full"><label>PRODUCT STORY / MORE INFO (한국어)</label><textarea data-i="${i}" data-k="description_ko">${esc(desc.ko)}</textarea></div><div class="field full"><label>PHOTOS</label><input data-i="${i}" data-photo="1" type="file" accept="image/*" multiple><div class="muted">Choose one or more images. They will be uploaded to the repository when you save.</div><div class="thumbs">${(p.images||[]).map((src,j)=>`<div><img class="thumb" src="${esc(src)}"><button type="button" data-photo-del="${i}" data-photo-index="${j}">REMOVE</button></div>`).join('')}</div></div></div>`;wrap.appendChild(el)});
wrap.querySelectorAll('[data-i][data-k]').forEach(x=>x.addEventListener('input',()=>{const p=data.products[Number(x.dataset.i)],k=x.dataset.k;
if(k==='price'||k==='stock')p[k]=Number(x.value||0);
else if(k==='soldOut')p[k]=x.checked;
else if(k==='name_en'){p.name=langOf(p.name);p.name.en=x.value}
else if(k==='name_ko'){p.name=langOf(p.name);p.name.ko=x.value}
else if(k==='description_en'){p.description=langOf(p.description);p.description.en=x.value}
else if(k==='description_ko'){p.description=langOf(p.description);p.description.ko=x.value}
else p[k]=x.value;
renderHeaderOnly()}));
wrap.querySelectorAll('[data-i][data-k="soldOut"]').forEach(x=>x.addEventListener('change',()=>{data.products[Number(x.dataset.i)].soldOut=x.checked}));
wrap.querySelectorAll('[data-photo-del]').forEach(x=>x.addEventListener('click',()=>{const p=data.products[Number(x.dataset.photoDel)],idx=Number(x.dataset.photoIndex);p.images.splice(idx,1);render()}));
wrap.querySelectorAll('[data-del]').forEach(x=>x.addEventListener('click',()=>{if(confirm('Delete this product?')){data.products.splice(Number(x.dataset.del),1);render()}}));
wrap.querySelectorAll('[data-photo]').forEach(x=>x.addEventListener('change',()=>{x.dataset.filesReady='1'}));
}
function renderHeaderOnly(){document.querySelectorAll('.product').forEach((el,i)=>{const n=el.querySelector('.productName');if(n)n.textContent=nameText(data.products[i]?.name)||'NEW DESIGN'})}
function collectFiles(){return [...document.querySelectorAll('[data-photo]')].map(x=>({index:Number(x.dataset.i),files:[...x.files]})).filter(x=>x.files.length)}
async function uploadImage(path,file){const buf=await file.arrayBuffer();let bin='';const bytes=new Uint8Array(buf);const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode(...bytes.subarray(i,i+chunk));const content=btoa(bin);let existing=null;try{existing=await getFile(path)}catch(e){if(!String(e.message).includes('404'))throw e}const body={message:'Add product image',content,branch:$('branch').value.trim()||'main'};if(existing?.sha)body.sha=existing.sha;return api(path,{method:'PUT',headers:headers(),body:JSON.stringify(body)})}
async function saveProducts(){saveConn();$('productStatus').textContent='SAVING...';try{checkConnection();
const uploads=collectFiles();
for(const item of uploads){const p=data.products[item.index];p.images=p.images||[];for(const file of item.files){$('productStatus').textContent='UPLOADING IMAGE...';const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path='assets/products/'+slug(p.id||nameText(p.name))+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;await uploadImage(path,file);p.images.push(path)}}
data.products.forEach((p,i)=>{p.id=p.id||slug(nameText(p.name))+'-'+Date.now()+i;p.price=Number(p.price||0);p.stock=Math.max(0,Number(p.stock||0));p.soldOut=!!p.soldOut;p.images=p.images||[];p.name=langOf(p.name);p.description=langOf(p.description)});
$('productStatus').textContent='SAVING PRODUCTS...';
await putFileFresh('products.json',JSON.stringify({version:1,products:data.products},null,2),'Update products');
render();$('productStatus').textContent='SAVED. Refresh the shop to see the changes.'
}catch(e){$('productStatus').textContent='ERROR: '+e.message}}
async function saveNotice(){saveConn();$('noticeStatus').textContent='SAVING...';try{config.announcement={en:$('announcementEn').value,ko:$('announcementKo').value};await putFileFresh('site-config.json',JSON.stringify({announcement:config.announcement},null,2),'Update announcement');$('noticeStatus').textContent='SAVED.'}catch(e){$('noticeStatus').textContent='ERROR: '+e.message}}
async function load(){saveConn();$('connStatus').textContent='LOADING...';try{const [p,c]=await Promise.all([getFile('products.json'),getFile('site-config.json')]);data=JSON.parse(decodeURIComponent(escape(atob(p.content.replace(/\n/g,'')))));config=JSON.parse(decodeURIComponent(escape(atob(c.content.replace(/\n/g,'')))));const a=langOf(config.announcement);$('announcementEn').value=a.en;$('announcementKo').value=a.ko;render();await loadGallery();$('connStatus').textContent='CONNECTED.'}catch(e){$('connStatus').textContent='ERROR: '+e.message}}
$('loadBtn').addEventListener('click',load);$('saveAll').addEventListener('click',saveProducts);$('saveNotice').addEventListener('click',saveNotice);$('saveGallery').addEventListener('click',saveGallery);$('newFolder').addEventListener('click',()=>{gallery.folders.push({id:'',name:{en:'NEW GALLERY FOLDER',ko:''},images:[]});renderGallery();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})});$('newProduct').addEventListener('click',()=>{data.products.push({id:'',name:{en:'NEW JOSHUA CARTER DESIGN',ko:''},price:0,stock:0,soldOut:true,description:{en:'',ko:''},images:[]});render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})});
fetch('products.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>render());fetch('site-config.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{const a=langOf(x.announcement);$('announcementEn').value=a.en;$('announcementKo').value=a.ko}).catch(()=>{});fetch('gallery.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{gallery=x&&Array.isArray(x.folders)?x:{version:1,folders:[]};renderGallery()}).catch(()=>{gallery={version:1,folders:[]};renderGallery()});
})();
</script></body></html>
